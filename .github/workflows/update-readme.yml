name: Actualizar tarjetas del README

on:
  schedule:
    - cron: '0 3 * * *'        # cada día 03 UTC
  workflow_dispatch:

permissions:
  contents: write              # permite hacer push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - uses: actions/checkout@v5

      # 2) Configurar Git
      - name: Configurar Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3) Probar el generador: si una prueba falla, no se genera ni se publica nada
      - name: Probar el generador
        run: python3 -m unittest discover -s tests -v

      # 4) Generar las tarjetas desde la API de GitHub (sin servicios de terceros)
      - name: Generar tarjetas SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats_cards.py "${{ github.repository_owner }}"

      # 5) Commit & push si cambió algo
      - name: Commit y push
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git add assets
            git commit -m "chore: auto-update README stats [skip ci]"
            git push
            echo "SVG actualizados ✔"
          else
            echo "Sin cambios en SVG ✔"
          fi
